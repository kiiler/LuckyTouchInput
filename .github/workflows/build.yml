name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore LuckyTouchInput.sln
      - name: Build
        run: dotnet build LuckyTouchInput.sln -c Release --no-restore
      - name: Geometry checks
        run: dotnet run --project tests/LuckyTouchInput.Tests -c Release --no-build
      - name: Publish portable Windows build
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTouchInput-win-x64
          path: |
            artifacts/LuckyTouchInput-0.1.0-alpha-win-x64.zip
            artifacts/LuckyTouchInput-0.1.0-alpha-win-x64.zip.sha256
